name: Update calendar data

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install icalendar recurring-ical-events
      - name: Build calendar data
        env:
          OUTLOOK_ICS: ${{ secrets.OUTLOOK_ICS }}
          BRIGHTSPACE_ICS: ${{ secrets.BRIGHTSPACE_ICS }}
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: python scripts/build.py
      - name: Save new data
        run: |
          git config user.name "scoot-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update calendar data"
            git pull --rebase --autostash
            git push
          fi
